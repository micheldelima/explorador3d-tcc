<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="author" content="Michel de Lima" />
  <meta name="description" content="Trabalho final da disciplina de desenvolvimento mobile" />
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0" />
  <title>Explorador 3D - Imagens</title>

  <script src="js/aframe.min.js"></script>
  <script src="js/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: red;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      z-index: 1000;
    }
  </style>
</head>

<body>
<div id="status">Aponte a câmera para o marcador Hiro...</div>

<a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; matrixCodeType: 3x3; facingMode: environment;"
        renderer="colorManagement: true;"
        vr-mode-ui="enabled: false"
>
  <a-marker
          preset="hiro"
          id="marker"
          emitevents="true"
          smooth="true"
          smoothCount="5"
          smoothTolerance="0.01"
  >
    <a-image
            id="imagemAR"
            src="imagens/boy_reading.png"
            position="0 0 0"
            rotation="-90 0 0"
            scale="0.8 0.8 0.8"
    ></a-image>

    <!-- Texto flutuante acima da imagem -->
    <a-text
            id="nomeImagem"
            value="The boy is reading a book."
            position="0 0.6 0"
            align="center"
            color="#FFFFFF"
            width="2.5"
            font="mozillavr"
            shader="msdf"
    ></a-text>
  </a-marker>

  <a-entity light="type: ambient; color: #CCC; intensity: 0.8"></a-entity>
  <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="1 1 0.5"></a-entity>
  <a-entity camera></a-entity>
</a-scene>

<script>
  const statusDiv = document.getElementById("status");
  const marker = document.querySelector("#marker");

  let marcadorVisivel = false;
  let timeoutPerda = null;

  // Quando o marcador é encontrado
  marker.addEventListener("markerFound", () => {
    marcadorVisivel = true;
    clearTimeout(timeoutPerda);
  });

  // Quando o marcador é perdido
  marker.addEventListener("markerLost", () => {
    marcadorVisivel = false;
    clearTimeout(timeoutPerda);
    timeoutPerda = setTimeout(() => {
      if (!marcadorVisivel) {
        statusDiv.style.color = "#ff4444";
        statusDiv.innerHTML = "Aponte a câmera para o marcador Hiro...";
      }
    }, 800);
  });

  window.updateImageInfo = function (nome, traducao) {
    marcadorVisivel = true;
    clearTimeout(timeoutPerda);

    statusDiv.style.color = "lime";
    statusDiv.innerHTML = `Marcador encontrado: ${nome} → ${traducao}`;
  };
</script>

</body>
</html>
